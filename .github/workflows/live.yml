name: Live data

# Checks pqc-kit against real post-quantum certificates from the IETF Hackathon
# (dozens of independent implementations) and scans real code bases, so that
# new algorithms, OIDs and formats are caught even when pqc-kit does not change.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: python -m pip install -e ".[dev]"
      - name: Fetch the IETF Hackathon PQC certificates
        run: git clone --depth 1 https://github.com/IETF-Hackathon/pqc-certificates "$RUNNER_TEMP/pqc-certificates"
      - name: Live tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v -s -rs tests/test_live.py | tee live.txt
          # Fail if any live test was skipped instead of run.
          if grep -qE "[0-9]+ skipped" live.txt; then echo "Live tests were skipped"; exit 1; fi
          grep -E "certificates from" live.txt >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "passed" live.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"
        env:
          PQC_KIT_LIVE: "1"
          PQC_KIT_HACKATHON_DIR: ${{ runner.temp }}/pqc-certificates
      - name: Scan real code bases without crashing
        shell: bash
        run: |
          pqc-kit scan "$(go env GOROOT)/src/crypto" --format json -o go-crypto.json
          pqc-kit scan "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" --format json -o site-packages.json
          pqc-kit cbom "$(go env GOROOT)/src/crypto" -o go-crypto.cdx.json
          pqc-kit cbom "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" -o site-packages.cdx.json
          python - <<'PY'
          import json
          from cyclonedx.schema import SchemaVersion
          from cyclonedx.validation.json import JsonStrictValidator
          for name in ("go-crypto.cdx.json", "site-packages.cdx.json"):
              errors = JsonStrictValidator(SchemaVersion.V1_6).validate_str(open(name).read())
              assert errors is None, f"{name}: {errors}"
          for name in ("go-crypto.json", "site-packages.json"):
              data = json.load(open(name))
              print(f"{name}: {len(data['findings'])} findings in {data['files_scanned']} files")
          PY
